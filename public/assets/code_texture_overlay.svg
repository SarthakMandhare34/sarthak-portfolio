<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%" fill="none">
  <!-- Code Editor Window Header -->
  <g opacity="0.6">
    <circle cx="35" cy="35" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="52" cy="35" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="69" cy="35" r="5" fill="#10B981" opacity="0.8" />
    <rect x="95" y="22" width="130" height="26" rx="6" fill="currentColor" fill-opacity="0.08" />
    <text x="110" y="39" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="currentColor" font-weight="600">sarthak.ts</text>
  </g>

  <!-- Line Numbers & Code Lines -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace" font-size="15" letter-spacing="-0.02em">
    <!-- Line numbers -->
    <g fill="currentColor" opacity="0.25" text-anchor="end">
      <text x="45" y="85">1</text>
      <text x="45" y="115">2</text>
      <text x="45" y="145">3</text>
      <text x="45" y="175">4</text>
      <text x="45" y="205">5</text>
      <text x="45" y="235">6</text>
      <text x="45" y="265">7</text>
      <text x="45" y="295">8</text>
      <text x="45" y="325">9</text>
      <text x="45" y="355">10</text>
      <text x="45" y="385">11</text>
      <text x="45" y="415">12</text>
      <text x="45" y="445">13</text>
      <text x="45" y="475">14</text>
      <text x="45" y="505">15</text>
      <text x="45" y="535">16</text>
      <text x="45" y="565">17</text>
      <text x="45" y="595">18</text>
      <text x="45" y="625">19</text>
      <text x="45" y="655">20</text>
    </g>

    <!-- Code Syntax -->
    <g transform="translate(70, 0)">
      <!-- Line 1: Comment -->
      <text x="0" y="85" fill="currentColor" opacity="0.45" font-style="italic">// Sarthak Mandhare · Full-Stack &amp; AI Integrator</text>

      <!-- Line 2: import { GeminiAI } from '@google/genai'; -->
      <text x="0" y="115">
        <tspan fill="#F43F5E" font-weight="600">import</tspan>
        <tspan fill="currentColor" opacity="0.8"> { GeminiAI } </tspan>
        <tspan fill="#F43F5E" font-weight="600">from</tspan>
        <tspan fill="#10B981"> &apos;@google/genai&apos;</tspan>
        <tspan fill="currentColor" opacity="0.8">;</tspan>
      </text>

      <!-- Line 3: import { React, TypeScript } from 'web-stack'; -->
      <text x="0" y="145">
        <tspan fill="#F43F5E" font-weight="600">import</tspan>
        <tspan fill="currentColor" opacity="0.8"> { React, TypeScript } </tspan>
        <tspan fill="#F43F5E" font-weight="600">from</tspan>
        <tspan fill="#10B981"> &apos;web-stack&apos;</tspan>
        <tspan fill="currentColor" opacity="0.8">;</tspan>
      </text>

      <!-- Line 4: Blank -->

      <!-- Line 5: export interface Engineer { -->
      <text x="0" y="205">
        <tspan fill="#3B82F6" font-weight="600">export interface </tspan>
        <tspan fill="#F59E0B">Engineer </tspan>
        <tspan fill="currentColor" opacity="0.8">{</tspan>
      </text>

      <!-- Line 6: name: string; -->
      <text x="25" y="235" fill="currentColor" opacity="0.85">
        <tspan fill="#38BDF8">name</tspan>: <tspan fill="#3B82F6">string</tspan>;
      </text>

      <!-- Line 7: degree: string; -->
      <text x="25" y="265" fill="currentColor" opacity="0.85">
        <tspan fill="#38BDF8">degree</tspan>: <tspan fill="#3B82F6">string</tspan>;
      </text>

      <!-- Line 8: cgpa: number; -->
      <text x="25" y="295" fill="currentColor" opacity="0.85">
        <tspan fill="#38BDF8">cgpa</tspan>: <tspan fill="#3B82F6">number</tspan>;
      </text>

      <!-- Line 9: projects: Project[]; -->
      <text x="25" y="325" fill="currentColor" opacity="0.85">
        <tspan fill="#38BDF8">projects</tspan>: <tspan fill="#F59E0B">Project</tspan>[];
      </text>

      <!-- Line 10: } -->
      <text x="0" y="355" fill="currentColor" opacity="0.8">}</text>

      <!-- Line 11: const sarthak: Engineer = { -->
      <text x="0" y="385">
        <tspan fill="#F43F5E" font-weight="600">const </tspan>
        <tspan fill="#38BDF8">sarthak</tspan>
        <tspan fill="currentColor" opacity="0.8">: </tspan>
        <tspan fill="#F59E0B">Engineer </tspan>
        <tspan fill="currentColor" opacity="0.8">= {</tspan>
      </text>

      <!-- Line 12: name: "Sarthak Mandhare", -->
      <text x="25" y="415">
        <tspan fill="#38BDF8">name</tspan>
        <tspan fill="currentColor" opacity="0.8">: </tspan>
        <tspan fill="#10B981">&quot;Sarthak Mandhare&quot;</tspan>
        <tspan fill="currentColor" opacity="0.8">,</tspan>
      </text>

      <!-- Line 13: degree: "BSc CS · Model College", -->
      <text x="25" y="445">
        <tspan fill="#38BDF8">degree</tspan>
        <tspan fill="currentColor" opacity="0.8">: </tspan>
        <tspan fill="#10B981">&quot;BSc CS · Model College&quot;</tspan>
        <tspan fill="currentColor" opacity="0.8">,</tspan>
      </text>

      <!-- Line 14: cgpa: 6.95, -->
      <text x="25" y="475">
        <tspan fill="#38BDF8">cgpa</tspan>
        <tspan fill="currentColor" opacity="0.8">: </tspan>
        <tspan fill="#F59E0B">6.95</tspan>
        <tspan fill="currentColor" opacity="0.8">,</tspan>
      </text>

      <!-- Line 15: internships: ["IBM", "Lenovo LEAP"], -->
      <text x="25" y="505">
        <tspan fill="#38BDF8">internships</tspan>
        <tspan fill="currentColor" opacity="0.8">: [</tspan>
        <tspan fill="#10B981">&quot;IBM SkillsBuild&quot;</tspan>
        <tspan fill="currentColor" opacity="0.8">, </tspan>
        <tspan fill="#10B981">&quot;Lenovo LEAP&quot;</tspan>
        <tspan fill="currentColor" opacity="0.8">],</tspan>
      </text>

      <!-- Line 16: stack: ["React", "TypeScript", "Node.js", "MySQL", "MongoDB"], -->
      <text x="25" y="535">
        <tspan fill="#38BDF8">stack</tspan>
        <tspan fill="currentColor" opacity="0.8">: [</tspan>
        <tspan fill="#10B981">&quot;React&quot;</tspan>
        <tspan fill="currentColor" opacity="0.8">, </tspan>
        <tspan fill="#10B981">&quot;Node.js&quot;</tspan>
        <tspan fill="currentColor" opacity="0.8">, </tspan>
        <tspan fill="#10B981">&quot;MySQL&quot;</tspan>
        <tspan fill="currentColor" opacity="0.8">, </tspan>
        <tspan fill="#10B981">&quot;Gemini AI&quot;</tspan>
        <tspan fill="currentColor" opacity="0.8">],</tspan>
      </text>

      <!-- Line 17: }; -->
      <text x="0" y="565" fill="currentColor" opacity="0.8">};</text>

      <!-- Line 18: async function deploySolutions() { -->
      <text x="0" y="595">
        <tspan fill="#F43F5E" font-weight="600">async function </tspan>
        <tspan fill="#F59E0B">deploySolutions</tspan>
        <tspan fill="currentColor" opacity="0.8">() {</tspan>
      </text>

      <!-- Line 19: await buildRealWorldUtility(); -->
      <text x="25" y="625">
        <tspan fill="#F43F5E" font-weight="600">await </tspan>
        <tspan fill="#38BDF8">buildWebSystems</tspan>
        <tspan fill="currentColor" opacity="0.8">({ fast: </tspan>
        <tspan fill="#F59E0B">true</tspan>
        <tspan fill="currentColor" opacity="0.8">, tested: </tspan>
        <tspan fill="#F59E0B">true</tspan>
        <tspan fill="currentColor" opacity="0.8"> });</tspan>
      </text>

      <!-- Line 20: } -->
      <text x="0" y="655" fill="currentColor" opacity="0.8">}</text>
    </g>
  </g>
</svg>
